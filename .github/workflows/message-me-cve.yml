name: message-me-cve

# Self-chaining: every run ends by dispatching the next one, after the
# "tick" environment's wait timer (no runner used while waiting).
# GitHub's cron starts runs hours late or not at all; it is only a backup
# that restarts the chain if it ever breaks. The concurrency group keeps at
# most one run going and one pending, so extra chains merge into one.
# NVD is polled at most every 2 h; the program enforces that itself.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: message-me-cve
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PROFILES_DIR: profiles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check feeds and send alerts
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: go run .

      - name: Save state
        if: always()
        run: |
          git config user.name message-me-cve
          git config user.email message-me-cve@users.noreply.github.com
          git add state
          git diff --cached --quiet && exit 0
          msg="$RUNNER_TEMP/message-me-cve-commit.txt"
          if [ -f "$msg" ]; then
            git commit -F "$msg"
          else
            git commit -m "message-me-cve: update state"
          fi
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

  next:
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: tick
    steps:
      - name: Dispatch next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run message-me-cve.yml -R "$GITHUB_REPOSITORY" --ref main && exit 0
            sleep $((i * 10))
          done
          exit 1
