name: message-me-cve

# Every 2 h: each run ends by starting the next one (job "next"). GitHub
# starts scheduled runs hours late or drops them, while workflow_dispatch
# runs start within seconds. The hourly cron only restarts the chain if it
# ever breaks. Late runs only delay alerts: KEV is read in full every run
# and the NVD cursor covers any gap. NVD is polled at most every 2 h,
# enforced by the program.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write # push state to the state branch

# One run at a time: the state branch has a single writer.
concurrency:
  group: message-me-cve
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 80 # one 60-minute round of NVD retries, plus margin
    # persist-credentials: false keeps the write token off disk, so the
    # step that parses third-party feed data cannot read it. Save state
    # gets it through env. (The pinned actions receive it as an input.)
    steps:
      # The code CI promoted, not main: a commit that failed CI never runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: live
          persist-credentials: false

      - name: Check out state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state
          path: state
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
          # Newest 1.27.x, not whatever the runner has cached: Go security
          # fixes ship as patch releases.
          check-latest: true

      - name: Check feeds and send alerts
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: go run ./cmd/message-me-cve -profiles profiles -state state/state.json

      # Also after a failed check: alerts it delivered must stay marked sent.
      - name: Save state
        if: always()
        working-directory: state
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config user.name message-me-cve
          git config user.email message-me-cve@users.noreply.github.com
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:state

  # Wait, then start the next run. Runs after a failed check too, so one
  # failure does not stop the chain. A cron or manual run that queues
  # behind this one is replaced by the run started here (one pending run
  # per concurrency group), so there is only ever one chain.
  next:
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      actions: write # start the next run
    steps:
      - name: Wait 2 h
        run: sleep 60

      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run message-me-cve.yml -R "$GITHUB_REPOSITORY" --ref main && exit 0
            sleep $((i * 10))
          done
          exit 1
