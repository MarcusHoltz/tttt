name: message-me-cve

# Started by an outside cron service through the workflow_dispatch API,
# not by GitHub's schedule: event, which dropped most runs on this
# account. See README, Schedule. NVD is polled at most every 2 h, enforced
# by the program.
on:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: the state branch has a single writer.
concurrency:
  group: message-me-cve
  cancel-in-progress: false

jobs:
  check:
    name: Check feeds
    runs-on: ubuntu-latest
    timeout-minutes: 80 # one 60-minute round of NVD retries, plus margin
    permissions:
      contents: write # push state to the state branch
    steps:
      # persist-credentials: false keeps the write token off disk, so the
      # step that parses third-party feed data cannot read it. Save state
      # gets it through env. (The pinned actions receive it as an input.)
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state
          path: state
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # No go.sum: the module has no dependencies to cache.
          cache: false
          # Newest 1.27.x, not whatever the runner has cached: Go security
          # fixes ship as patch releases.
          check-latest: true

      - name: Check feeds and send alerts
        env:
          # Delivery channels
          NTFY_URL: ${{ secrets.NTFY_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # NVD API key: higher rate limit
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: go run . -profiles profiles -state state/state.json

      # Also after a failed check: alerts it delivered must stay marked sent.
      - name: Save state
        if: always()
        working-directory: state
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config user.name message-me-cve
          git config user.email message-me-cve@users.noreply.github.com
          if [ ! -f state.json ]; then
            echo "No state.json written, nothing to push"
            exit 0
          fi
          git add state.json
          if git diff --cached --quiet; then
            echo "State unchanged, nothing to push"
            exit 0
          fi
          git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:state
