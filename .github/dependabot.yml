version: 2
updates:
  # Workflow actions, pinned by SHA with a version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Dockerfile base image, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # staticcheck and govulncheck. go get -tool records them as indirect,
  # which Dependabot skips by default. Only the two tool modules: bumping
  # one also moves the dependencies it requires.
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    allow:
      - dependency-name: golang.org/x/vuln
        dependency-type: all
      - dependency-name: honnef.co/go/tools
        dependency-type: all
    groups:
      tools:
        patterns:
          - "*"
